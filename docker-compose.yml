services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://bro_user:bro_password@db:5432/bro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-me-in-production
      - JWT_REFRESH_SECRET=change-me-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gemini-3.5-flash}
      - ELEVENLABS_API_KEY=
      - PORT=3000
      - TOOL_FS_ROOT=/app/data/sandbox
      - INTEGRATION_REDIRECT_BASE=${INTEGRATION_REDIRECT_BASE:-http://localhost:3000/api/v1/integrations}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - NOTION_CLIENT_ID=${NOTION_CLIENT_ID:-}
      - NOTION_CLIENT_SECRET=${NOTION_CLIENT_SECRET:-}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL:-https://graph.facebook.com/v18.0}
      # Chromium runs as the unprivileged `node` user inside the container.
      - BROWSER_NO_SANDBOX=true
    volumes:
      - bro_sandbox_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Inlined at build time; the browser needs to reach this URL.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bro_user
      POSTGRES_PASSWORD: bro_password
      POSTGRES_DB: bro
    ports:
      - '5432:5432'
    volumes:
      - bro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bro_user -d bro']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - bro_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  bro_postgres_data:
  bro_redis_data:
  bro_sandbox_data:
