# Continuous deployment:
#   1. Builds and pushes `bro` + `bro-web` images to GHCR on every push to
#      the default branch (and manually via workflow_dispatch).
#   2. SSHes into the server and runs `docker compose -f docker-compose.yml
#      -f docker-compose.prod.yml up -d` with the freshly pushed images.
#
# Required repository secrets/variables:
#   - vars.NEXT_PUBLIC_API_URL    public URL of the API, e.g. https://api.example.com/api/v1
#   - secrets.DEPLOY_HOST         server IP/hostname
#   - secrets.DEPLOY_USER         SSH user
#   - secrets.DEPLOY_SSH_KEY      private SSH key (ed25519)
#   - secrets.DEPLOY_PORT         SSH port (default 22)
# The server must have the repository checked out at ~/bro with a populated
# .env (REGISTRY, BRO_VERSION, JWT_SECRET, ENCRYPTION_KEY, ...).

name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute version tag
        id: meta
        run: echo "version=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bro:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/bro:latest
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ github.repository }}/bro-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/bro-web:latest

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            cd "$HOME/bro"
            git pull --ff-only

            # Point REGISTRY at this repo's GHCR namespace and pin BRO_VERSION.
            export REGISTRY="ghcr.io/${{ github.repository }}"
            export BRO_VERSION="${{ needs.build-and-push.outputs.version }}"

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull app web

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --remove-orphans

            docker image prune -f
